<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Timer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="nav">
        <a href="../index.html" class="back-btn">⬅ Back to Home</a>
    </div>

    <div class="container">
        <header>
            <h1 class="title">Time Together ⏱️</h1>
            <p class="subtitle">Every second with you is a blessing.</p>
        </header>

        <div class="timer-box">
            <h2>We have been together for...</h2>
            <div class="time-display" id="timeDisplay">
                <div class="time-unit">
                    <span id="days">00</span>
                    <label>Days</label>
                </div>
                <div class="time-unit">
                    <span id="hours">00</span>
                    <label>Hours</label>
                </div>
                <div class="time-unit">
                    <span id="minutes">00</span>
                    <label>Minutes</label>
                </div>
                <div class="time-unit">
                    <span id="seconds">00</span>
                    <label>Seconds</label>
                </div>
            </div>
            <p class="footer-text">...and I want to spend a lifetime more.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
