<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters for Abinaya ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Floating hearts background effect container -->
    <div id="hearts-bg"></div>

    <div class="container">
        <header>
            <h1>For My Abinaya ❤️</h1>
            <p>Open these letters whenever you need me...</p>
            
            <div class="love-counter">
                <p class="counter-title">Our Beautiful Journey Started...</p>
                <div class="counter-box" id="loveCounter">
                    <!-- Timer will be injected here -->
                </div>
            </div>
        </header>

        <main id="letters-container" class="letters-grid">
            <!-- Letters will be dynamically generated by script.js -->
        </main>
    </div>

    <!-- Letter Reading Modal -->
    <div id="letter-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="close-btn" id="close-modal">✖</button>
            <div class="paper">
                <div class="paper-content">
                    <h2 id="letter-title">Title</h2>
                    <div class="divider"></div>
                    <p id="letter-body">Body</p>
                    <p class="signature">With endless love, <br> Your purusen ❤️</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        Developed by your purusen ❤️
    </footer>

    <script src="script.js"></script>
</body>
</html>
