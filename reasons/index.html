<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why I Love You</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="nav">
        <a href="../index.html" class="back-btn">⬅ Back to Home</a>
    </div>

    <div class="container">
        <header>
            <h1 class="title">Reasons Why I Love You 💌</h1>
            <p class="subtitle">Click the heart to discover a new reason.</p>
        </header>

        <div class="generator-box">
            <div class="reason-display" id="reasonDisplay">
                <p>I love everything about you...</p>
            </div>
            <button id="generateBtn" class="heart-btn">
                <span class="heart-icon">❤️</span>
                <span class="btn-text">Tell Me Why</span>
            </button>
        </div>
    </div>
    
    <div id="floating-hearts-container"></div>

    <script src="script.js"></script>
</body>
</html>
