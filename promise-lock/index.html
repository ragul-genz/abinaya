<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Lock</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="nav">
        <a href="../index.html" class="back-btn">⬅ Back to Home</a>
    </div>

    <div class="container">
        <header>
            <h1 class="title">Our Promise Lock 🔒</h1>
            <p class="subtitle">A symbol of our unbreakable bond.</p>
        </header>

        <div class="lock-container">
            <div class="bridge"></div>
            
            <div class="lock" id="promiseLock">
                <div class="shackle"></div>
                <div class="lock-body">
                    <div class="names">You & Me</div>
                    <div class="keyhole"></div>
                </div>
            </div>
            
            <p class="instruction" id="instructionText">Click the lock to seal our promise</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
