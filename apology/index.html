<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Confession</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="rain" id="rain"></div>
    
    <div class="message-container">
        <p class="text-line" id="line-1">Naan pannathukellam sorry...</p>
        <p class="text-line" id="line-2">En mela kovam irunthaal mannichidu.</p>
        <p class="text-line highlight" id="line-3">But... Unna naan unmaiya love panren ❤️</p>
        <p class="text-line" id="line-4">Nee thaan en ulagam.</p>
        
        <button class="forgive-btn" id="forgive-btn">I Forgive You 🥺</button>
    </div>

    <div class="sunshine" id="sunshine"></div>
    
    <div class="happy-message" id="happy-message">
        <h1>Thank You My Love! ❤️</h1>
        <p>I promise to always keep you happy.</p>
        <a href="../index.html" class="home-btn">Back to Our World</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
